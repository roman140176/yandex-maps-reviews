         "text": "Отвратительный сервис Яндекс-доставка. Ценники задраны до небес, отправить маленький предмет из Курска можно только в коробке S  размера, конверты для нашей провинции не предусмотрены. Стоимость доставки растёт как на дрожжах, а отправление может два три дня валяться на пвз. Посылка Курск-Москва едет неделю, как и в Почте России, и ценник такой же, а ещё куча правил, что можно, а чего нельзя отправлять. За конфету в отправлении сотрудник пвз поднял хай, как будто это наркотики я пыталась отправить. Учитывая, что преимущества сервиса стремятся к нулю, планирую завязать с его использованием",

         "text": "Достоинства: 1.Удобная и продуманная экосистема: все сервисы работают в одном аккаунте 2.Быстрая и простая оплата через Яндекс Pay без ввода данных карты\nНедостатки: не обнаружил\nПользуюсь картой Яндекс Pay и в целом очень доволен. Карта удобна для повседневных покупок, работает стабильно, оплата проходит быстро как онлайн, так и офлайн. Приятный плюс — всё полностью интегрировано в экосистему Яндекса, не нужно использовать отдельные приложения.\n\n\n\nОтдельно хочу отметить баллы и кэшбэк. Начисления приходят регулярно за покупки, особенно выгодно пользоваться картой в сервисах Яндекса и у партнёров. Баллы удобно тратить, они реально экономят деньги, а не просто «копятся для галочки».\n\nНравится наличие Яндекс Сейфа — создаёт ощущение дополнительной безопасности средств и данных. Также удобно, что есть стикер Яндекс Pay: можно платить телефоном или стикером без лишних действий, очень выручает в повседневных ситуациях.\n\nФункция Сплит — ещё один большой плюс. Возможность разделить оплату на части без лишней бюрократии действительно удобна, особенно для крупных покупок.\n\nПоддержка Яндекса в целом оставила хорошее впечатление: вопросы решаются, ответы понятные, чувствуется, что сервисом реально занимаются.\n\nВ итоге карта Яндекс Pay — это удобный, современный и выгодный продукт с кэшбэком, бонусами и полезными функциями. Пользоваться приятно, могу смело рекомендовать.",
         "textLanguage": "ru",
         "textTranslations": {
          "tr": "Avantajlar: 1.Kullanışlı ve düşünceli bir ekosistem: Tüm hizmetler tek bir hesapta çalışır 2.Kart bilgilerini girmeden Yandex Pay ile hızlı ve kolay ödeme\nDezavantajları: tespit edilmedi\nYandex Pay kartını kullanıyorum ve genel olarak çok memnunum. Kart günlük alışverişler için uygundur, istikrarlı çalışır, ödeme hem çevrimiçi hem de çevrimdışı olarak hızlıdır. Hoş bir artı— her şeyin Yandex ekosistemine tamamen entegre olmasıdır, ayrı uygulamalar kullanmanıza gerek yoktur.\n\n\n\nPuanları ve geri ödemeyi ayrı ayrı not etmek istiyorum. Tahakkuklar satın alımlar için düzenli olarak gelir, kartı Yandex hizmetlerinde ve ortaklarda kullanmak özellikle faydalıdır. Puanları harcamak uygundur, gerçekten paradan tasarruf ederler ve sadece «gösteri için biriktirmezler».\n\nYandex Kasasının varlığını severim - fonlar ve veriler için ek güvenlik hissi yaratır. Yandex Pay etiketinin olması da uygundur: gereksiz adımlar atmadan telefonla veya çıkartmayla ödeme yapabilirsiniz, günlük durumlarda çok faydalıdır.\n\nBölme işlevi başka bir büyük artıdır. Ekstra bürokrasi olmadan ödemeyi parçalara ayırabilmek, özellikle büyük alımlar için gerçekten uygundur.\n\nYandex'in bir bütün olarak desteği iyi bir izlenim bıraktı: sorular çözülüyor, cevaplar açık, hizmete gerçekten katıldıkları anlaşılıyor.\n\nSonuç olarak, Yandex Pay kartı, geri ödeme, bonuslar ve kullanışlı özelliklere sahip kullanışlı, modern ve karlı bir üründür. Kullanımı güzel, güvenle tavsiye edebilirim."

         "text": "Не рекомендую использовать сервис Яндекс Пэй для ведения бизнеса. Мы подключили его для своей компании, но за три месяца работы из 25 транзакций только три платежа поступили на наш счёт. Причём в разные месяцы.\nСчёт не заблокирован и указан правильно в сервисе, но деньги, оплаченные клиентами через Яндекс Пэй, до нас так и не дошли. Мы вынуждены отказывать клиентам в услугах и просить их оформлять возврат через Яндекс.\nПри попытке разобраться в ситуации служба поддержки Яндекс Пэй четыре раза закрывала мою заявку. Они отвечали раз в два дня, запрашивая одну и ту же информацию, которую мы предоставили с самого начала. По результатам обращений нам сообщили, что проблем на их стороне нет. При этом счёт не заблокирован, и те три транзакции, что всё же прошли из 25, приходили в разные месяцы.\nПопытаться дозвониться в компанию невозможно, а переписываться с поддержкой раз в два дня, получая одинаковые ответы, просто не имеет смысла. В результате мы потеряли клиентов и почти две сотни рублей.\n",
         "textLanguage": "ru",
