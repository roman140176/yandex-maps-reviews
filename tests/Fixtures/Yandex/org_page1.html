         "author": {

          "avatarUrl": "https://avatars.mds.yandex.net/get-yapic/30061/JMemvxJ0teY0XmJnAoqSdjiHv2k-1/{size}",
          "professionLevel": "Знаток города 12 уровня",

         "text": "Это отзыв о посещении офиса. \n\nПо приглашению решила не обойти стороной гиганта среди монополистов рынка; мной движил интерес - как выглядит пространство для их сотрудников? \n\nПланировка кабинетно-коридорная. \nНа каждом этаже зона для обеда с двумя видами кофемашин, что-то для перекуса и обязательно безлактозное молоко в холодильнике. \nНа лестничной площадке минималистичная схема расположения переговорных с  нестандарными названиями. «На завтра запланирована встреча в переговорной «Аргентина-Ямайка»». Но многих названий я не поняла… \n\nНа последнем этаже организована веранда, с высоты которой можно увидеть многие достопримечательности Москвы. \nМне понравилась обстановка на крыше: рабочий день кончился, коллеги теперь друзья, отмечающие с тобой день рождения или просто созерцающие закат. Никто не торопится домой, все наслаждаются моментом. А может это просто очень хороший трюк, чтобы сотрудники дольше оставались на работе?))) И да, там тоже стоят две кофемашины. \n\nПроходя по коридорам, невольно хочется заглянуть в каждый кабинет, потому что за стеклянными перегородками я вижу хорошо обставленное пространство с частичкой интересов сотрудников (или кого-то конкретного). В одном из корпусов кто-то занимается танцами, во внутреннем дворе играют в пинг-понг. \n\nВ интерьер столовой чуть добавили ЧМ 2026, поставив картонные фигуры звезд футбола и ворота с мячом. \n\n\nВечерняя прогулка по зданию оставила только приятное впечатление, и тут большая заслуга организатора вечера) ",
         "textLanguage": "ru",
         "textTranslations": {
          "tr": "Bu, ofis ziyaretiyle ilgili bir geri bildirimdir. \n\nDavetle, piyasanın tekelleri arasında devi atlamamaya karar verdim; İlgiden etkilendim - çalışanları için alan neye benziyor? \n\nDolap ve koridorun düzeni. \nHer katta iki çeşit kahve makinesinin bulunduğu öğle yemeği alanı, atıştırmalık için bir şeyler ve buzdolabında mutlaka laktozsuz süt bulunmaktadır. \nİnişte, geleneksel olmayan isimlere sahip toplantı odalarının minimalist bir düzeni vardır. \"Yarın Arjantin-Jamaika müzakere odasında bir toplantı planlanıyor». Ama pek çok ismi anlamadım… \n\nÜst katta, yüksekliğinden Moskova'nın birçok manzarasını görebileceğiniz bir veranda düzenlenmiştir. \nÇatıdaki ortamı beğendim: iş günü sona erdi, meslektaşlarım artık sizinle doğum gününü kutlayan ya da sadece gün batımını düşünen arkadaşlar. Kimse eve acele etmiyor, herkes anın tadını çıkarıyor. Ya da belki bu, çalışanların işte daha uzun süre kalmaları için çok iyi bir numaradır?))) Ve evet, orada da iki kahve makinesi var. \n\nKoridorlardan geçerken istemeden her ofise bakmak istiyorum çünkü cam bölmelerin arkasında çalışanların (veya belirli birinin) çıkarlarının bir kısmının olduğu iyi döşenmiş bir alan görüyorum. Binalardan birinde dans eden biri var, avluda masa tenisi oynuyorlar. \n\nFutbol yıldızlarının karton figürlerini ve topla kaleyi koyarak yemek odasının iç kısmına 2026 Dünya Kupası'nı biraz eklediler. \n\n\nAkşam binadaki yürüyüş sadece hoş bir izlenim bıraktı ve burada akşam organizatörüne büyük bir değer verildi) "

        {
         "businessComment": {
          "text": "Благодарим за поддержку! Положительные отзывы всегда мотивируют нас!",

         "reviewId": "8SiRikIHhiJlaDGOG_sNLA0BW1C4GdEQ",

         "author": {
          "name": "Александр Владимиров",
          "avatarUrl": "https://avatars.mds.yandex.net/get-yapic/48449/greL5YZAcLZ8Fjf1Dy3LKVRBo-1/{size}",
          "professionLevel": "Знаток города 30 уровня",
          "rtb": "Знаток города 30 уровня",
          "rtbType": "PROFESSION",
          "publicId": "ave22here",

          "professions": [],
          "isSubscribed": false
         },
         "text": "Что можно сказать про Яндекс?\nЯндекс - это удивительный мир, множество сервисов, услуг, товаров (обо многих из них большинство даже не знает, но пользуется).\nЯндекс - это крутой работодатель; настолько крутой, что, например, врачи говорят об их страховке, как о лучшем, что они видели.\n\nМне посчастливилось побывать в офисе Яндекса лишь однажды, но и это было очень здорово, очень круто.\nОдно название переговорки - \"Вода на киселе\" - чего стоит! -)\n\nРядом с переговоркой были две фигурки - жалею, что не сфотографировал их - Ёжик и Крош из Смешариков, но красного и жёлтого цвета.\nТо есть Смешарики и M&M's - 2 в 1.\n\nКонечно же, и весь район живёт Яндексом.\nВ близлежащих ресторанах и кафе сотрудники едят и проводят встречи.\nВ музей (кстати, потрясающий) заходят люди, чтобы увидеть историю компьютеров, поиграть в старые игры и купить мерч.\nНу, и, конечно, приветствуют Коня (который иногда бывает в пальто) - он прямо на входе в офис.\n\nКрутая компания, отличный офис.\nЖдём когда будет переезд в новый - он уже выглядит впечатляюще. \n\nUPDATE: вернулся к своему отзыву - удивительно, что хорошие оценки собирают столько минусов, а отрицательные - столько плюсов -))\nИ я тут не столько переживаю за себя, сколько хотел бы защитить Яндекс (хотя, по правде говоря, ему защита и не нужна -))\nДрузья, если вам не нравится Яндекс - почему бы не пользоваться альтернативными сервисами?\nНо ответ, мне кажется, очевиден - как бы мы к этому ни относились, Яндекс (по большей части) - это лучшие продукты, доступные на российском рынке. Например, Диск или Карты - ничем не хуже Гугла (а местами даже лучше).\nПоэтому давайте и критиковать, и оценивать компанию конструктивно и объективно.\nВедь мир - не чёрно-белый, а между оценками 1 и 5 есть ещё несколько цифр -))",
         "textLanguage": "ru",
         "textTranslations": {
          "tr": "Yandex hakkında ne söylenebilir?\nYandex harika bir dünya, birçok hizmet, hizmet, mal (çoğu bunların çoğunu bile bilmiyor ama kullanıyor).\nYandex havalı bir işverendir; o kadar havalı ki, örneğin doktorlar sigortalarından gördükleri en iyi şey olarak bahsediyorlar.\n\nYandex'in ofisini sadece bir kez ziyaret edecek kadar şanslıydım ama bu da çok harikaydı, çok harikaydı.\nMüzakerenin bir adı \"Jöle üzerindeki su\" dur - buna değer! -)\n\nMüzakerenin yanında iki figür vardı - onları fotoğraflamadığım için üzgünüm - Bir kirpi ve Smeshariks'ten bir parça, ancak kırmızı ve sarı renkte.\nYani Smeshariki ve M&M'ler - 2'si 1 arada.\n\nTabii ki, tüm bölge Yandex tarafından yaşıyor.\nYakındaki restoran ve kafelerde çalışanlar yemek yiyor ve toplantı yapıyor.\nİnsanlar bilgisayarların tarihini görmek, eski oyunları oynamak ve mal satın almak için müzeye (bu arada harika) giriyorlar.\nVe elbette, Atı (bazen paltolu olan) selamlıyorlar - o doğrudan ofisin girişinde.\n\nHarika bir şirket, harika bir ofis.\nYenisine taşınmayı bekliyoruz - şimdiden etkileyici görünüyor. \n\nGÜNCELLEME: Geri bildirimime geri döndüm - iyi puanların bu kadar çok eksi ve olumsuz puanların bu kadar çok artı toplaması şaşırtıcı -))\nVe burada kendim için Yandex'i korumak istediğim kadar endişelenmiyorum (gerçekte korumaya ihtiyacı olmasa da -))\nArkadaşlar, Yandex'i beğenmediyseniz - neden alternatif hizmetler kullanmıyorsunuz?\nAncak cevap bana açık görünüyor - bununla ne kadar ilgili olursak olalım, Yandex (çoğunlukla) Rusya pazarında mevcut olan en iyi ürünler. Örneğin, Disk veya Kartlar Google'dan daha kötü değildir (ve bazı yerlerde daha da iyidir).\nBu nedenle, şirketi yapıcı ve nesnel bir şekilde hem eleştirelim hem de değerlendirelim.\nSonuçta, dünya siyah beyaz değil, 1 ve 5 puanları arasında birkaç rakam daha var -))"
         },

         "businessComment": {
          "text": "Спасибо, что сообщили. Очень жаль, что у вас сложилось неприятное впечатление. Пожалуйста, напишите нам на почту: support.taxi@go.yandex.ru.\n\nПостараемся разобраться в возникшей ситуации.",
          "updatedTime": "2026-07-13T07:12:49.856Z"
         },
         "reviewId": "h1aELdRQr-r-gOL7mt_1C28A79E3h7",
         "businessId": "1124715036",
         "author": {
          "name": "Виктория",
          "avatarUrl": "https://avatars.mds.yandex.net/get-yapic/30061/qENLYQzex0LcBkb3LzyjsPU-1/{size}",
          "professionLevel": "Знаток города 6 уровня",
          "rtb": "Знаток города 6 уровня",
          "rtbType": "PROFESSION",
          "publicId": "gb62epw51kez19f3rfuj9h0bdm",
          "achievements": [],
          "professions": [],
          "isSubscribed": false
         },
         "text": "Когда проводите акции и выделяете бюджет, берите, пожалуйста, компетентных сотрудников на это\n. 11 июля я была на мероприятии «Транспорт Яндекс Go» в Парке Горького. Стояла в очереди с 5 вечера, но не успела: автомат то ломался, то люди влезали без очереди, потому что территория не была огорожена. Потом ограждение поставили, но время уже подходило к концу.\nКогда всё закончилось, народ возмутился — некоторые стояли с 12 дня и даже с часу, но так и не получили карты. Сотрудники ответили: «Приходите завтра». Люди просили дать хотя бы немного времени или раздать карты — организаторы были против. В итоге толпа взломала дверцу автомата и нахватала карт сама. Те, кто не стал этого делать, опять попросили раздать карты, но снова получили отказ. \nИ тут начинается самое вопиющее противоречие. Сначала сотрудники говорили, что не могут раздавать карты, потому что это грозит им какими-то штрафами и нарушением лимитов. Однако, когда я по просьбе охранника отошла, они чудесным образом начали раздавать эти карты — без всяких штрафов и проблем! Я подхожу и спрашиваю: можно ли мне, ведь я стояла до конца? А мне девушка отвечает: «У нас лимит, не могу».\nВот где логика? Сначала говорить про  штрафы, чтобы отказать, потом раздают, но когда я подошла прям передо мной отдавали последнию карту — то резко лимит. Сами себе противоречат. \nСтояла под ливнем и промокла, чтоб такую несправедливость увидеть. Спасибо за жизненный урок Яндекс. ",
         "textLanguage": "ru",
         "textTranslations": {
          "tr": "Promosyonlar düzenlediğinizde ve bütçe ayırdığınızda, lütfen bunun için yetkin çalışanları alın\n. 11 Temmuz'da Gorky Park'taki Yandex Ulaşım Go etkinliğindeydim. Akşam 5'ten beri sıradaydım ama vaktim olmadı: makine kırıldı ya da bölge çitle çevrilmediği için insanlar sıraya girmeden girdiler. Sonra çitleri yerleştirdiler ama zaman çoktan sona eriyordu.\nHer şey bittiğinde, insanlar öfkelendiler - bazıları 12. günden itibaren ve hatta bir saatten itibaren durdular, ancak hiç kart almadılar. Personel, «Yarın gelin» yanıtını verdi. İnsanlar en azından biraz zaman verilmesini veya kartların dağıtılmasını istediler - organizatörler buna karşıydı. Sonuç olarak, kalabalık makinenin kapısını kırdı ve kartları kendileri aldı. Bunu yapmayanlar yine kartları dağıtmalarını istediler ama yine reddedildiler. \nVe işte burada en bariz çelişki başlıyor. İlk başta çalışanlar kartları dağıtamayacaklarını söylediler çünkü bu onları bir tür para cezası ve limitleri ihlal etmekle tehdit ediyor. Ancak, güvenlik görevlisinin isteği üzerine ayrıldığımda, mucizevi bir şekilde bu kartları dağıtmaya başladılar — herhangi bir ceza veya sorun olmadan! Gelip soruyorum: Yapabilir miyim, çünkü sonuna kadar ayakta durdum? Kız bana cevap veriyor: \"Sınırımız var, yapamam»\"\nMantık burada mı? Önce inkar etmek için para cezaları hakkında konuşurlar, sonra dağıtırlar, ama ben hemen önüme geldiğimde kartı ikincisine verirlerdi - bu keskin bir sınırdır. Kendileriyle çelişiyorlar. \nBöyle bir adaletsizliği görmek için sağanağın altında durup ıslandı. Yandex'in hayat dersi için teşekkürler. "
         },

         "text": "Офис просто супер! Очень уютно, комфортно. Спасибо огромное хозяюшкам, которые за всем следят! Чистота! Много мест для коворкинга! По вторникам дают попкорн, а по средам сырки! Кофепоинты - отдельная тема! Все для сотрудников - чай, кофе, бутерброды, печеньки, фрукты, овощи! Есть спортзалы, массажные кресла, теннисные столы, йога зал, душ и многое другое! В БЦ Аврора есть место для игры в Падл! Переговорки со своими необычными названиями топ!!! Роботы доставщики такие милашки, а какая красивая посуда в кофепоинтах! 🔥 😍 в общем мне очень повезло что там работает моя тетя) Теперь и я хочу туда устроиться !",

         "text": "Начала пользоваться Яндекс Банком. Просто в восторге! Настроила приложение  за считанные минуты. Очень радует то, что Банк заботится о безопасности своих клиентов, высокий уровень безопасности, я не переживаю за свои данные. Оплата через Яндекс Пей проходит мгновенно, это экономит моё время и нервы. И кешбеки большие и такси могу заказать, и покушать вкусненько, прям в приложении выбираю, что захочу! Удобно и классно одним словом! ",
