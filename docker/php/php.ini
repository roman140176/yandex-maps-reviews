memory_limit = 512M
max_execution_time = 120

; Review pages are ~1 MB of HTML each and are parsed one at a time, so the
; default limits are plenty — this only guards against a runaway page.
post_max_size = 16M
upload_max_filesize = 16M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

expose_php = off
